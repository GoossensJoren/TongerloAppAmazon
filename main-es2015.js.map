export default "<div class=\"container\">\r\n  <agm-map [latitude]=\"latitude\" [longitude]=\"longitude\" [zoom]=\"12\">\r\n    <agm-marker [latitude]=\"latitude\" [longitude]=\"longitude\">\r\n      <agm-info-window [isOpen]=true>\r\n\r\n        <div>\r\n          <p class=\"infoWindowTitle\">LOCATIE :</p>\r\n          <p>Tongerlodorp 2260 Tongerlo, Antwerpen, België</p>\r\n        </div>\r\n\r\n      </agm-info-window>\r\n    </agm-marker>\r\n  </agm-map>\r\n\r\n  <div (click)=\"redirect('facebook')\" class=\"fbLogo socials-button\">Facebook</div>\r\n  <div (click)=\"redirect()\" class=\"instagramLogo socials-button\">Instagram</div>\r\n</div>"
