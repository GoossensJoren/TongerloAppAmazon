export default "<mat-sidenav-container class=\"sidenav-container\">\r\n  <mat-sidenav #drawer class=\"sidenav\" [ngClass]=\"{hidden: (isHandset$ | async) === false}\"\r\n    [attr.role]=\"(isHandset$ | async) ? 'dialog' : 'navigation'\" [mode]=\"(isHandset$ | async) ? 'over' : 'side'\"\r\n    [opened]=\"(isHandset$ | async) === false\" position=\"end\">\r\n    <mat-toolbar>Menu</mat-toolbar>\r\n    <mat-nav-list>\r\n      <a mat-list-item [routerLink]=\"['/home']\">Home</a>\r\n      <a mat-list-item [routerLink]=\"['/tickets']\">Tickets</a>\r\n      <a mat-list-item [routerLink]=\"['/images']\">Foto's</a>\r\n      <a mat-list-item [routerLink]=\"['/info']\">Praktische Info</a>\r\n      <a mat-list-item [routerLink]=\"['/tongerloleeft']\">Tongerlo Leeft</a>\r\n      <a mat-list-item [routerLink]=\"['/contact']\">Contact</a>\r\n    </mat-nav-list>\r\n  </mat-sidenav>\r\n  <mat-sidenav-content>\r\n    <mat-toolbar color=\"primary\">\r\n      <img class=\"logo\" src=\"../../../assets/images/logo.png\" />\r\n      <span class=\"spacer\"></span>\r\n      <p class=\"sloganSpan\" [ngClass]=\"{hidden: (isHandset$ | async) === false}\">Tongerlo leeft!</p>\r\n      <div class=\"toolbarItems\" [ngClass]=\"{hidden: (isHandset$ | async) === true}\">\r\n        <a [routerLink]=\"['/home']\" routerLinkActive=\"active-link\">Home</a>\r\n        <a [routerLink]=\"['/tickets']\" routerLinkActive=\"active-link\">Tickets</a>\r\n        <a [routerLink]=\"['/images']\" routerLinkActive=\"active-link\">Foto's</a>\r\n        <a [routerLink]=\"['/info']\" routerLinkActive=\"active-link\">Praktische Info</a>\r\n        <a [routerLink]=\"['/tongerloleeft']\" routerLinkActive=\"active-link\">Tongerlo Leeft</a>\r\n        <a [routerLink]=\"['/contact']\" routerLinkActive=\"active-link\">Contact</a>\r\n      </div>\r\n      <button type=\"button\" aria-label=\"Toggle sidenav\" mat-icon-button (click)=\"drawer.toggle()\"\r\n        *ngIf=\"isHandset$ | async\">\r\n        <mat-icon aria-label=\"Side nav toggle icon\">menu</mat-icon>\r\n      </button>\r\n    </mat-toolbar>\r\n    <router-outlet></router-outlet>\r\n    <app-footer></app-footer>\r\n  </mat-sidenav-content>\r\n</mat-sidenav-container>"
